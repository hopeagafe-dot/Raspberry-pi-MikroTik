<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MCE Change Password</title>
  <style>
    :root {
      --text: #f5f7ff;
      --muted: #a2acc7;
      --card: rgba(75, 103, 168, 0.333);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text);
      /* status.html과 동일한 배경 */
      background-image:
        radial-gradient(1200px 600px at 20% -10%, rgba(126, 214, 215, 0.151), rgba(14, 24, 43, 0.381)),
        url('background.jpg');
      background-size: auto, cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 28px 60px rgba(5, 10, 30, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px);
    }
    h2 { margin-bottom: 20px; text-align: center; font-size: 20px; }
    
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
    
    .pw-wrapper { position: relative; }
    input {
      width: 100%;
      padding: 10px 40px 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
      font-size: 14px;
    }
    input:focus { outline: none; border-color: #4da3ff; }
    
    .eye-icon {
      position: absolute;
      right: 10px; top: 50%; transform: translateY(-50%);
      cursor: pointer; width: 20px; height: 20px; fill: #bbb;
    }
    
    .btn-row { display: flex; gap: 10px; margin-top: 25px; }
    button {
      flex: 1; padding: 12px; border-radius: 12px; border: none;
      font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .btn-submit { background: linear-gradient(180deg, #4da3ff, #2b78e4); color: white; }
    .btn-cancel { background: rgba(255,255,255,0.1); color: #ddd; }
    .btn-cancel:hover { background: rgba(255,255,255,0.2); }

    .msg-box {
        margin-top: 15px; padding: 10px; border-radius: 8px; font-size: 13px; display: none; word-break: break-all;
    }
    .msg-err { background: rgba(255, 80, 80, 0.2); color: #ffadad; border: 1px solid rgba(255, 80, 80, 0.3); }
    .msg-ok { background: rgba(50, 200, 100, 0.2); color: #8affc1; border: 1px solid rgba(50, 200, 100, 0.3); }
  </style>
</head>
<body>

<div class="card">
  <h2>Change Password</h2>
  
  <input type="hidden" id="user" value="$(username)">

  <div class="input-group">
    <label>Current Password</label>
    <div class="pw-wrapper">
      <input type="password" id="currPw" placeholder="Current Password">
      <svg class="eye-icon" onclick="togglePw('currPw', this)" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
    </div>
  </div>

  <div class="input-group">
    <label>New Password</label>
    <div class="pw-wrapper">
      <input type="password" id="newPw" placeholder="New Password">
      <svg class="eye-icon" onclick="togglePw('newPw', this)" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
    </div>
  </div>

  <div class="input-group">
    <label>Confirm New Password</label>
    <div class="pw-wrapper">
      <input type="password" id="confPw" placeholder="Confirm New Password">
      <svg class="eye-icon" onclick="togglePw('confPw', this)" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
    </div>
  </div>

  <div id="msgBox" class="msg-box"></div>

  <div class="btn-row">
    <button class="btn-cancel" onclick="goBack()">Cancel</button>
    <button class="btn-submit" onclick="changePassword(event)" id="subBtn">Save</button>
  </div>
</div>

<script>
// 아이콘 데이터
const EYE_OPEN = "M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z";
const EYE_SLASH = "M11.83 9L15 12.17V12a3 3 0 00-3-3h-.17zm-4.3.8l1.55 1.55c-.05.21-.08.43-.08.65a3 3 0 003 3c.22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53a5 5 0 01-5-5c0-.79.2-1.53.53-2.2zm-2.53-1.1L2.1 5.8 3.5 4.4l15 15-1.4 1.4-2.9-2.9C13.2 18.66 12.61 19 12 19c-5 0-9.27-3.11-11-7.5C2.17 8.5 4.5 6.1 7.2 4.9l-2.2-2.2zM12 6c1.63 0 3.16.59 4.37 1.57l-1.6 1.6C14.07 8.52 13.08 8 12 8c-2.21 0-4 1.79-4 4 0 1.08.52 2.07 1.17 2.77l-1.6 1.6C6.59 15.16 5.1 13.63 4.1 12c1.4-3.5 4.8-6 8.9-6z";

function togglePw(id, svg) {
    const el = document.getElementById(id);
    const path = svg.querySelector('path');
    if(el.type === "password"){
        el.type = "text"; path.setAttribute("d", EYE_SLASH); svg.style.fill = "#fff";
    } else {
        el.type = "password"; path.setAttribute("d", EYE_OPEN); svg.style.fill = "#bbb";
    }
}


// 초기화
window.onload = function() {
    ["currPw", "newPw", "confPw"].forEach(id => {
        const el = document.getElementById(id);
        if(el){ el.value=""; el.type="password"; }
    });
};

function showMsg(txt, isErr) {
    const box = document.getElementById("msgBox");
    box.style.display = "block";
    box.className = "msg-box " + (isErr ? "msg-err" : "msg-ok");
    box.innerText = txt;
}

function goBack() {
    window.location.href = "status.html";
}

function changePassword() {
// 💡 추가된 코드: 이벤트의 기본 동작(폼 제출/페이지 리로드)을 차단
    const user = document.getElementById("user").value;
    const currPw = document.getElementById("currPw").value.trim();
    const newPw = document.getElementById("newPw").value.trim();
    const confPw = document.getElementById("confPw").value.trim();
    const btn = document.getElementById("subBtn");

    if(!user) {
        showMsg("Cannot proceed. User not defined.", true);
        return;
    }

    if(newPw !== confPw) {
        showMsg("New passwords do not match!", true);
        document.getElementById("confPw").value = "" ;
        document.getElementById("confPw").focus();
        return;
    }

    btn.disabled = true;
    btn.innerText = "Processing...";
    showMsg("Connecting to server...", false);


    // ★ mce_admin_api.py (포트 5000)으로 요청
    fetch("http://192.168.88.31:5000/api/hotspot/change_password", {
        method: "POST",
        body: new URLSearchParams({
            user: user,
            current_password: currPw,
            new_password: newPw
        })
    })

    .then(r => r.json())

    .then(data => {
      if (data.ok) {
        showMsg("SUCCESS! Password changed.", false);
        alert("Password changed successfully.\nPlease log in again.");
        window.location.href = "status.html";
      } else {
        showMsg("FAILED: " + (data.reason || "Unknown error"), true);
      }
    })

    .catch(err => {
      showMsg("Network Error: " + err.message, true);
      console.error(err);
    })

    .finally(() => {
      btn.disabled = false;
      btn.innerText = "Save"; 
    });

 
    
    //.then(r => {
    //    // 💡 1. HTTP 상태 코드가 200 범위(r.ok)인지 먼저 확인
    //    if (!r.ok) {
    //        // 4xx, 5xx 에러
    //        return r.json()
    //            .then(errorData => {
    //                // 서버가 보낸 JSON 에러 메시지 처리 (예: {"error": "Current password not correct."})
    //                showMsg(`Error (${r.status}): ${errorData.error || 'Unknown server error.'}`, true);
    //                throw new Error('Server returned an error.'); // .catch로 흐름 전달
    //            })
    //            .catch(err => {
    //                // JSON 파싱 실패 등, 서버가 JSON을 안 보낸 경우
    //                throw new Error(`API returned status ${r.status} and non-JSON body.`);
    //            });
    //    }
    //    // 2. 200 OK인 경우, JSON 파싱 시도
    //    return r.json();
    //})

    //.then(data => {
    //    btn.disabled = false;
    //    btn.innerText = "Save";

    //    if(data.ok) {
    //        showMsg("SUCCESS! Password changed.", false);
    //        alert("Password changed successfully.\nPlease log in again.");
    //        // 성공 시 로그아웃 처리하거나 status로 이동
    //        window.location.href = "status.html"; 
    //    } else {
    //        showMsg("FAILED: " + (data.reason || "Unknown error"), true);
    //    }
    //})

    //  .catch(error => {
    //      btn.disabled = false;
    //      btn.innerText = "Save";

    //      // 이미 위에서 에러 메시지를 표시했는지 확인하여 중복 메시지 방지
    //      if (!err.message.includes('Server returned an error')) {
    //           showMsg(`Network Error: ${error.message}`, true);
    //           console.error("Change PW Fetch Error:", err);
    //      }

        //showMsg("Network Error: " + err, true);
    //  });

    

}
</script>
</body>
</html>
