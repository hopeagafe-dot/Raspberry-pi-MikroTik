<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usage Analytics - MCE StarLink</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
  <style>
    :root {
      --bg-deep: #020617;
      --bg-card: rgba(15, 23, 42, 0.85);
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --accent-purple: #a855f7;
      --glass: rgba(255, 255, 255, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--bg-deep);
      background-image: 
        linear-gradient(rgba(2, 6, 23, 0.8), rgba(2, 6, 23, 0.8)),
        url('background.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-main);
      padding: 20px 16px;
      min-height: 100vh;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 헤더 카드 */
    .header-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 24px 28px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-text h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 900;
      background: linear-gradient(to bottom, #ffffff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .header-text p {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    /* 헤더 내 로고 */
    .header-logo {
      height: 60px;
      width: auto;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.9))
              drop-shadow(0 0 10px rgba(255, 255, 255, 0.5))
              drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
      transition: transform 0.3s ease, filter 0.3s ease;
      cursor: pointer;
    }

    .header-logo:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.9))
              drop-shadow(0 0 16px rgba(255, 255, 255, 0.7))
              drop-shadow(0 0 24px rgba(255, 255, 255, 0.5));
    }
    .user-badge {
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--bg-card);
      backdrop-filter: blur(10px);
      color: var(--accent);
    }

    /* 필터 툴바 */
    .filter-toolbar {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .filter-group {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px;
      border-radius: 12px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #000;
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3);
    }

    .date-picker-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .date-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
      transition: all 0.2s;
    }

    .date-input:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.08);
    }

    .date-input::-webkit-calendar-picker-indicator {
      filter: invert(0.8);
      cursor: pointer;
    }

    .apply-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .apply-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
    }

    /* 통계 카드 그리드 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .stat-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stat-value.upload { color: var(--accent-purple); }
    .stat-value.download { color: var(--accent-green); }
    .stat-value.total { color: var(--accent); }
    .stat-value.avg { color: var(--accent-orange); }

    .stat-sub {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* 차트 카드 */
    .chart-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--glass);
    }

    .chart-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .chart-subtitle {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .chart-container {
      position: relative;
      height: 320px;
      width: 100%;
    }

    /* 로딩/에러 */
    .loading, .error {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }

    .loading::before {
      content: "⏳";
      font-size: 3rem;
      display: block;
      margin-bottom: 16px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .error {
      color: var(--accent-red);
      display: none;
    }

    .error::before {
      content: "⚠️";
      font-size: 3rem;
      display: block;
      margin-bottom: 16px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* 반응형 - 태블릿 가로 */
    @media (max-width: 1024px) and (min-width: 769px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .filter-group { flex-wrap: wrap; }
    }

    /* 반응형 - 모바일/태블릿 세로 */
    @media (max-width: 768px) {
      body { padding: 12px; }
      .header-card { padding: 20px; }
      .header-left { flex-direction: column; gap: 12px; align-items: flex-start; }
      .header-logo { height: 50px; }
      .filter-toolbar { padding: 12px; flex-direction: column; align-items: stretch; }
      .filter-group { justify-content: center; }
      .date-picker-group { margin-left: 0; width: 100%; }
      .chart-container { height: 260px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }

    /* 반응형 - 작은 모바일 */
    @media (max-width: 480px) {
      .header-text h1 { font-size: 1.5rem; }
      .header-logo { height: 40px; }
      .filter-btn { font-size: 0.7rem; padding: 6px 10px; }
      .stats-grid { grid-template-columns: 1fr; gap: 10px; }
      .stat-value { font-size: 1.5rem; }
      .chart-container { height: 220px; }
    }

    /* 가로 모드 최적화 (모바일 가로) */
    @media (max-height: 600px) and (orientation: landscape) {
      body { padding: 8px; }
      .header-card { padding: 16px; }
      .stats-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .stat-card { padding: 12px; }
      .stat-value { font-size: 1.3rem; }
      .chart-container { height: 200px; }
      .filter-toolbar { padding: 10px; }
    }
  </style>
</head>
<body>

<div class="page">
  <!-- 헤더 -->
  <div class="header-card">
    <div class="header-left">
      <div class="header-text">
        <h1>Usage Analytics</h1>
        <p>Daily traffic monitoring & insights</p>
      </div>
      <a href="https://www.youtube.com/@marinechiefengineer4293" target="_blank" rel="noopener noreferrer">
        <img src="MCE_logo.png" alt="MCE StarLink Logo" class="header-logo" />
      </a>
    </div>
    <div class="user-badge" id="user-display">Loading...</div>
  </div>

  <!-- 로딩 -->
  <div class="loading" id="loading">Loading data...</div>
  
  <!-- 에러 -->
  <div class="error" id="error">Failed to load data</div>

  <!-- 콘텐츠 (초기 숨김) -->
  <div id="content" style="display: none;">
    <!-- 통계 카드 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Usage</div>
        <div class="stat-value total" id="total-usage">-</div>
        <div class="stat-sub" id="total-usage-sub"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Daily Average</div>
        <div class="stat-value avg" id="daily-avg">-</div>
        <div class="stat-sub" id="daily-avg-sub"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Peak Day</div>
        <div class="stat-value upload" id="peak-day">-</div>
        <div class="stat-sub" id="peak-day-sub"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Today's Usage</div>
        <div class="stat-value download" id="today-usage">-</div>
        <div class="stat-sub" id="today-usage-sub">Live (updates every 10s)</div>
      </div>
    </div>

    <!-- 필터 툴바 -->
    <div class="filter-toolbar">
      <div class="filter-group">
        <button class="filter-btn" onclick="setLastMonth()">Last Month</button>
        <button class="filter-btn" onclick="setRange(7)">7 Days</button>
        <button class="filter-btn" onclick="setRange(14)">14 Days</button>
        <button class="filter-btn active" onclick="setRange(30)">30 Days</button>
        <button class="filter-btn" onclick="setThisMonth()">This Month</button>
      </div>
      <div class="date-picker-group">
        <input type="date" id="start-date" class="date-input" />
        <span style="color: var(--text-dim);">~</span>
        <input type="date" id="end-date" class="date-input" />
        <button class="apply-btn" onclick="customRange()">Apply</button>
      </div>
    </div>

    <!-- 일일 증가분 차트 -->
    <div class="chart-card">
      <div class="chart-header">
        <div>
          <div class="chart-title">Daily Usage Increment</div>
          <div class="chart-subtitle" id="daily-range-text"></div>
        </div>
      </div>
      <div class="chart-container">
        <canvas id="dailyChart"></canvas>
      </div>
    </div>

    <!-- 누적 사용량 차트 -->
    <div class="chart-card">
      <div class="chart-header">
        <div>
          <div class="chart-title">Cumulative Usage</div>
          <div class="chart-subtitle">Total accumulated data over time</div>
        </div>
      </div>
      <div class="chart-container">
        <canvas id="cumulativeChart"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== 설정 ====================
const API_BASE = 'http://192.168.88.31:5000/daily_archives';
const params = new URLSearchParams(window.location.search);
const userName = params.get('user') || 'Unknown';

document.getElementById('user-display').textContent = userName;

let dailyChart = null;
let cumulativeChart = null;
let processedData = null; // 전역 데이터 저장

// ==================== 유틸리티 함수 ====================
function formatBytes(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
  const i = Math.floor(Math.log(Math.abs(bytes)) / Math.log(1000));
  return `${(bytes / Math.pow(1000, i)).toFixed(2)} ${sizes[i]}`;
}

// UTC 변환 방지: 로컬 날짜 → YYYY-MM-DD
function toLocalDateStr(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

// 차트 툴팁 자동 단위 (1000 기준)
function formatChartValue(value, baseUnit) {
  const bytes = baseUnit === 'GB' ? value * 1e9 : value * 1e6;
  if (bytes === 0) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  const i = Math.min(Math.floor(Math.log(Math.abs(bytes)) / Math.log(1000)), units.length - 1);
  return `${(bytes / Math.pow(1000, i)).toFixed(2)} ${units[i]}`;
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

// 날짜 범위 생성
function getDateRange(startDate, endDate) {
  const dates = [];
  const current = new Date(startDate);
  const end = new Date(endDate);
  
  while (current <= end) {
    dates.push(toLocalDateStr(current));
    current.setDate(current.getDate() + 1);
  }
  
  return dates;
}

// ==================== 데이터 로딩 ====================
async function loadDailyData(dateStr) {
  const url = `${API_BASE}/usage_daily_${dateStr}.json`;
  try {
    const response = await fetch(url);
    if (!response.ok) {
      // 파일이 없으면 null 반환 (0으로 처리)
      return null;
    }
    const data = await response.json();
    
    // 해당 사용자의 데이터 찾기
    const userObj = data.users.find(u => u.user === userName);
    if (!userObj) return null;
    
    // total_bytes + _offset_bytes 계산
    const totalUsage = (userObj.total_bytes || 0) + (userObj._offset_bytes || 0);
    
    return {
      date: dateStr,
      totalUsage: totalUsage,
      raw: userObj
    };
  } catch (err) {
    console.warn(`Failed to load ${dateStr}:`, err);
    return null;
  }
}

async function loadDataForRange(startDate, endDate) {
  const dates = getDateRange(startDate, endDate);

  // 시작일 하루 전을 baseline으로 로드 (첫날 increment 정확한 계산)
  const baselineDate = new Date(startDate);
  baselineDate.setDate(baselineDate.getDate() - 1);
  const baselineDateStr = toLocalDateStr(baselineDate);

  const [baselineResult, ...rangeResults] = await Promise.all([
    loadDailyData(baselineDateStr),
    ...dates.map(date => loadDailyData(date))
  ]);

  const dataMap = {};
  dataMap['_baseline'] = baselineResult ? baselineResult.totalUsage : null;
  dates.forEach((date, idx) => {
    dataMap[date] = rangeResults[idx] ? rangeResults[idx].totalUsage : 0;
  });

  return dataMap;
}

// ==================== 데이터 처리 ====================
function processData(dataMap) {
  const baseline = dataMap['_baseline'];
  const dates = Object.keys(dataMap).filter(d => d !== '_baseline').sort();
  const dailyIncrements = [];
  const cumulativeUsage = [];
  let cumulativeSum = 0;

  dates.forEach((date, idx) => {
    const currentTotal = dataMap[date];
    let increment = 0;

    if (idx === 0) {
      if (baseline !== null && baseline !== undefined) {
        // baseline 있음: 정상 증가면 차이, 리셋이면 currentTotal
        increment = currentTotal >= baseline ? currentTotal - baseline : currentTotal;
      } else {
        // baseline 파일 없음: 0으로 처리 (이상 수치 방지)
        increment = 0;
      }
    } else {
      const prevTotal = dataMap[dates[idx - 1]];
      increment = currentTotal >= prevTotal ? currentTotal - prevTotal : currentTotal;
    }

    cumulativeSum += increment;
    dailyIncrements.push({ date, increment });
    cumulativeUsage.push({ date, cumulative: cumulativeSum });
  });

  return { dailyIncrements, cumulativeUsage };
}

// ==================== 통계 계산 ====================
function updateStats(dailyIncrements) {
  const totalIncrement = dailyIncrements.reduce((sum, d) => sum + d.increment, 0);
  const avgIncrement = dailyIncrements.length > 0 ? totalIncrement / dailyIncrements.length : 0;
  
  // Peak Day 찾기 (가장 많이 사용한 날)
  let peakDay = null;
  let peakValue = 0;
  dailyIncrements.forEach(d => {
    if (d.increment > peakValue) {
      peakValue = d.increment;
      peakDay = d.date;
    }
  });
  
  // Total Usage
  document.getElementById('total-usage').textContent = formatBytes(totalIncrement);
  document.getElementById('total-usage-sub').textContent = `${dailyIncrements.length} days period`;
  
  // Daily Average
  document.getElementById('daily-avg').textContent = formatBytes(avgIncrement);
  document.getElementById('daily-avg-sub').textContent = 'per day';
  
  // Peak Day
  if (peakDay) {
    document.getElementById('peak-day').textContent = formatBytes(peakValue);
    document.getElementById('peak-day-sub').textContent = formatDate(peakDay);
  } else {
    document.getElementById('peak-day').textContent = '-';
    document.getElementById('peak-day-sub').textContent = 'No data';
  }
}

// ==================== 오늘의 사용량 (실시간) ====================
let todayUsageInterval = null;
let lastDailyTotal = 0;

async function findMostRecentDailyFile() {
  // 어제부터 과거 30일까지 검색 (오늘 파일은 아직 생성 안됨)
  const today = new Date();
  
  for (let i = 1; i <= 30; i++) {  // i=1부터 시작 (어제)
    const checkDate = new Date(today);
    checkDate.setDate(today.getDate() - i);
    const dateStr = toLocalDateStr(checkDate);
    
    try {
      const data = await loadDailyData(dateStr);
      // 데이터가 있고, totalUsage가 실제로 존재하는지 확인
      if (data && data.totalUsage !== null && data.totalUsage !== undefined) {
        console.log(`Found recent daily file: ${dateStr}, total: ${data.totalUsage}`);
        return {
          date: dateStr,
          totalUsage: data.totalUsage
        };
      }
    } catch (err) {
      console.warn(`Error checking ${dateStr}:`, err);
      continue;  // 에러 발생 시 다음 날짜 확인
    }
  }
  
  console.warn('No recent daily file found with user data in the last 30 days');
  return null;
}

async function updateTodayUsage() {
  try {
    const response = await fetch(`http://192.168.88.31:5000/api/usage_public?user=${encodeURIComponent(userName)}`);
    
    if (!response.ok) {
      throw new Error(`API returned ${response.status}`);
    }
    
    const currentData = await response.json();
    
    if (currentData.error) {
      throw new Error(currentData.error);
    }
    
    const currentTotal = (currentData.total_bytes || 0) + (currentData._offset_bytes || 0);
    const todayUsage = Math.max(0, currentTotal - lastDailyTotal);
    
    document.getElementById('today-usage').textContent = formatBytes(todayUsage);
    
    const now = new Date();
    const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    document.getElementById('today-usage-sub').textContent = `Updated at ${timeStr}`;
    
  } catch (err) {
    console.error('Error updating today usage:', err);
    document.getElementById('today-usage').textContent = 'N/A';
    document.getElementById('today-usage-sub').textContent = 'Update failed - will retry';
    // 에러 발생해도 interval은 계속 실행 (다음 10초 후 재시도)
  }
}

async function initTodayUsage() {
  try {
    // 가장 최근 daily 파일 찾기
    const recentDaily = await findMostRecentDailyFile();
    
    if (recentDaily) {
      lastDailyTotal = recentDaily.totalUsage;
      console.log(`Using baseline from ${recentDaily.date}: ${lastDailyTotal} bytes`);
    } else {
      lastDailyTotal = 0;
      console.warn('No baseline found, using 0');
      // 베이스라인이 없어도 계속 진행
      document.getElementById('today-usage-sub').textContent = 'No baseline data available';
    }
    
    // 첫 업데이트
    await updateTodayUsage();
    
    // 기존 interval 정리
    if (todayUsageInterval) {
      clearInterval(todayUsageInterval);
    }
    
    // 10초마다 자동 업데이트
    todayUsageInterval = setInterval(updateTodayUsage, 10000);
  } catch (err) {
    console.error('Error initializing today usage:', err);

// ==================== 필터 핸들러 ====================
function resetButtons() {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
}

async function applyFilter(startStr, endStr) {
  // 현재 스크롤 위치 저장
  const scrollPosition = window.pageYOffset || document.documentElement.scrollTop;
  
  document.getElementById('loading').style.display = 'block';
  document.getElementById('content').style.display = 'none';
  document.getElementById('error').style.display = 'none';
  
  try {
    // 데이터 로드
    const dataMap = await loadDataForRange(startStr, endStr);
    
    // 데이터 처리
    const { dailyIncrements, cumulativeUsage } = processData(dataMap);
    
    // 전역 저장
    processedData = { dailyIncrements, cumulativeUsage };
    
    // 통계 업데이트
    updateStats(dailyIncrements);
    
    // 차트 렌더링
    renderDailyChart(dailyIncrements);
    renderCumulativeChart(cumulativeUsage);
    
    // 날짜 범위 표시
    document.getElementById('daily-range-text').textContent = `${startStr} ~ ${endStr}`;
    
    // 화면 표시
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    
    // 스크롤 위치 복원
    setTimeout(() => {
      window.scrollTo(0, scrollPosition);
    }, 0);
    
    // 오늘의 사용량 초기화 (첫 로드시에만, 에러 발생해도 페이지는 정상 작동)
    if (!todayUsageInterval) {
      initTodayUsage().catch(err => {
        console.error('Today usage initialization failed, but page continues:', err);
        // 에러 발생해도 무시하고 계속 진행
      });
    }
    
  } catch (err) {
    console.error('Error loading data:', err);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    
    // 사용자 친화적인 에러 메시지
    let errorMsg = 'Failed to load usage data. ';
    if (err.message.includes('fetch')) {
      errorMsg += 'Please check your network connection.';
    } else if (err.message.includes('billing')) {
      errorMsg += 'Billing configuration error.';
    } else {
      errorMsg += 'Please try again later.';
    }
    document.getElementById('error').textContent = errorMsg;
  }
}

window.setRange = function(days) {
  resetButtons();
  const btns = document.querySelectorAll('.filter-btn');
  btns.forEach(b => {
    if (b.textContent.includes(days + ' Days')) {
      b.classList.add('active');
    }
  });
  
  const end = new Date();
  const start = new Date();
  start.setDate(end.getDate() - (days - 1));
  
  applyFilter(toLocalDateStr(start), toLocalDateStr(end));
};

// ==================== Billing Date 관련 ====================
// billing_date 캐시 (타임스탬프 기반 - 5초마다 자동 갱신)
let billingDateCache = null;
let billingDateCacheTimestamp = null;
const BILLING_DATE_CACHE_DURATION = 5000; // 5초

async function loadBillingDate(forceRefresh = false) {
  const now = Date.now();
  
  // 캐시가 유효한지 확인 (5초 이내)
  if (!forceRefresh && billingDateCache && billingDateCacheTimestamp && 
      (now - billingDateCacheTimestamp) < BILLING_DATE_CACHE_DURATION) {
    return billingDateCache;
  }
  
  try {
    const response = await fetch('http://192.168.88.31:5000/api/billing_date');
    if (!response.ok) throw new Error('Failed to load billing date');
    billingDateCache = await response.json();
    billingDateCacheTimestamp = now; // 타임스탬프 업데이트
    return billingDateCache;
  } catch (err) {
    console.error('Error loading billing_date.json:', err);
    // Fallback to default values
    return {
      billing_start_day: 1,
      last_reset_yyyymmdd: new Date().toISOString().split('T')[0].replace(/-/g, '')
    };
  }
}

function getDaysInMonth(year, month) {
  return new Date(year, month, 0).getDate();
}

function calculateBillingDay(year, month, billingStartDay) {
  const daysInMonth = getDaysInMonth(year, month);
  return Math.min(billingStartDay, daysInMonth);
}

async function calculateBillingPeriods() {
  const billingData = await loadBillingDate();
  const billingStartDay = billingData.billing_start_day || 1;

  const now = new Date();
  const todayYear  = now.getFullYear();
  const todayMonth = now.getMonth() + 1;
  const todayDay   = now.getDate();

  // 이번 달 예정일이 아직 안 지났으면 전달에서 시작
  let csYear, csMonth;
  if (todayDay >= billingStartDay) {
    csYear = todayYear; csMonth = todayMonth;
  } else {
    csMonth = todayMonth - 1; csYear = todayYear;
    if (csMonth < 1) { csMonth = 12; csYear--; }
  }

  const csDay = Math.min(billingStartDay, new Date(csYear, csMonth, 0).getDate());
  const currentStart = `${csYear}-${String(csMonth).padStart(2,'0')}-${String(csDay).padStart(2,'0')}`;
  const currentEnd   = toLocalDateStr(now);

  let psMonth = csMonth - 1, psYear = csYear;
  if (psMonth < 1) { psMonth = 12; psYear--; }
  const psDay = Math.min(billingStartDay, new Date(psYear, psMonth, 0).getDate());
  const prevStart = `${psYear}-${String(psMonth).padStart(2,'0')}-${String(psDay).padStart(2,'0')}`;
  const prevEnd   = toLocalDateStr(new Date(csYear, csMonth - 1, csDay - 1));

  return {
    current:  { start: currentStart, end: currentEnd },
    previous: { start: prevStart,    end: prevEnd    }
  };
}

window.setThisMonth = async function() {
  resetButtons();
  const btns = document.querySelectorAll('.filter-btn');
  btns.forEach(b => {
    if (b.textContent.includes('This Month')) {
      b.classList.add('active');
    }
  });
  
  try {
    const periods = await calculateBillingPeriods();
    applyFilter(periods.current.start, periods.current.end);
  } catch (err) {
    console.error('Error calculating This Month:', err);
    alert('Failed to calculate billing period');
  }
};

window.setLastMonth = async function() {
  resetButtons();
  const btns = document.querySelectorAll('.filter-btn');
  btns.forEach(b => {
    if (b.textContent.includes('Last Month')) {
      b.classList.add('active');
    }
  });
  
  const periods = await calculateBillingPeriods();
  applyFilter(periods.previous.start, periods.previous.end);
};

window.customRange = function() {
  resetButtons();
  const start = document.getElementById('start-date').value;
  const end = document.getElementById('end-date').value;
  
  if (start && end) {
    applyFilter(start, end);
  } else {
    alert('Please select both start and end dates');
  }
};


async function initializePage() {
  const periods = await calculateBillingPeriods();
  
  // 날짜 필드를 This Month로 초기화
  document.getElementById('start-date').value = periods.current.start;
  document.getElementById('end-date').value = periods.current.end;
  
  // 30일 기본값으로 시작
  window.setRange(30);
}

// 페이지 로드 시 초기화
initializePage();

// 페이지 포커스 시 billing_date 갱신 (탭 전환 후 돌아올 때)
window.addEventListener('focus', async () => {
  try {
    // billing_date 강제 갱신
    await loadBillingDate(true);
    
    // billing period 재계산
    const periods = await calculateBillingPeriods();
    
    // 현재 활성화된 필터 확인
    const activeBtn = document.querySelector('.filter-btn.active');
    if (activeBtn) {
      const btnText = activeBtn.textContent;
      
      // This Month 버튼이 활성화되어 있으면 갱신
      if (btnText.includes('This Month')) {
        window.setThisMonth();
      }
      // Last Month 버튼이 활성화되어 있으면 갱신
      else if (btnText.includes('Last Month')) {
        window.setLastMonth();
      }
      // 사용자 지정 날짜는 그대로 유지
    }
  } catch (err) {
    console.error('Error refreshing billing_date on focus:', err);
  }
});
